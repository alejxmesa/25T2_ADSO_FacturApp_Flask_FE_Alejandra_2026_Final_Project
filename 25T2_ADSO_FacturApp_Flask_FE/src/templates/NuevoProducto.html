{% extends "base.html" %}

{% block title %}Nuevo Producto - FacturApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0"><i class="bi bi-box-seam me-2"></i>Registrar Nuevo Producto</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/nuevo-producto">
                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-bold">
                            <i class="bi bi-card-text me-1"></i>Descripción *
                        </label>
                        <input type="text" class="form-control" id="descripcion" name="descripcion" 
                               placeholder="Ej: Tomates frescos" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="valor_unitario" class="form-label fw-bold">
                                <i class="bi bi-currency-dollar me-1"></i>Valor Unitario *
                            </label>
                            <input type="number" step="0.01" min="0" class="form-control" id="valor_unitario" 
                                   name="valor_unitario" placeholder="Ej: 50.00" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stock" class="form-label fw-bold">
                                <i class="bi bi-stack me-1"></i>Stock Inicial *
                            </label>
                            <input type="number" min="0" class="form-control" id="stock" name="stock" 
                                   placeholder="Ej: 100" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="categoria_id" class="form-label fw-bold">
                            <i class="bi bi-tags me-1"></i>Categoría *
                        </label>
                        <select class="form-select" id="categoria_id" name="categoria_id" required>
                            <option value="" selected disabled>Selecciona una categoría...</option>
                            {% for categoria in categorias %}
                            <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/lista-productos" class="btn btn-secondary btn-custom">
                            <i class="bi bi-x-lg me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-success btn-custom">
                            <i class="bi bi-check-lg me-2"></i>Guardar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
