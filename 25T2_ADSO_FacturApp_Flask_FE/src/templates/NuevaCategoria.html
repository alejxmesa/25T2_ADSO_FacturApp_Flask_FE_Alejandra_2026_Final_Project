{% extends "base.html" %}

{% block title %}Nueva Categoría - FacturApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0"><i class="bi bi-tag me-2"></i>Registrar Nueva Categoría</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/nueva-categoria">
                    <div class="mb-4">
                        <label for="nombre" class="form-label fw-bold">
                            <i class="bi bi-tag me-1"></i>Nombre de la Categoría *
                        </label>
                        <input type="text" class="form-control" id="nombre" name="nombre" 
                               placeholder="Ej: Electrónica, Ropa, Alimentos, etc." required>
                        <div class="form-text text-muted">
                            Ejemplos: Ropa, Electrónica, Alimentos, Hogar, Deportes, etc.
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/lista-categorias" class="btn btn-secondary btn-custom">
                            <i class="bi bi-x-lg me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-success btn-custom">
                            <i class="bi bi-check-lg me-2"></i>Guardar Categoría
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
