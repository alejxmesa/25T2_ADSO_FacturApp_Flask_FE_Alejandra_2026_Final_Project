{% extends "base.html" %}

{% block title %}Editar Cliente - FacturApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Cliente</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/editar-cliente/{{ cliente.id }}">
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">
                            <i class="bi bi-person me-1"></i>Nombre Completo *
                        </label>
                        <input type="text" class="form-control" id="nombre" name="nombre" 
                               value="{{ cliente.nombre }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">
                            <i class="bi bi-envelope me-1"></i>Correo Electrónico
                        </label>
                        <input type="email" class="form-control" id="email" name="email" 
                               value="{{ cliente.email or '' }}">
                    </div>
                    
                    <div class="mb-4">
                        <label for="telefono" class="form-label fw-bold">
                            <i class="bi bi-telephone me-1"></i>Teléfono
                        </label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" 
                               value="{{ cliente.telefono or '' }}">
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/lista-clientes" class="btn btn-secondary btn-custom">
                            <i class="bi bi-x-lg me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-warning btn-custom text-white">
                            <i class="bi bi-check-lg me-2"></i>Actualizar Cliente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
