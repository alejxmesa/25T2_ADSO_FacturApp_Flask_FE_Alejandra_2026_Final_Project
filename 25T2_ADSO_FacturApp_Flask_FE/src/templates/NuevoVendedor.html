{% extends "base.html" %}

{% block title %}Nuevo Vendedor - FacturApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0"><i class="bi bi-person-badge me-2"></i>Registrar Nuevo Vendedor</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/nuevo-vendedor">
                    <div class="mb-4">
                        <label for="nombre" class="form-label fw-bold">
                            <i class="bi bi-person me-1"></i>Nombre Completo *
                        </label>
                        <input type="text" class="form-control" id="nombre" name="nombre" 
                               placeholder="Ej: Ana López Martínez" required>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/lista-vendedores" class="btn btn-secondary btn-custom">
                            <i class="bi bi-x-lg me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-success btn-custom">
                            <i class="bi bi-check-lg me-2"></i>Guardar Vendedor
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
